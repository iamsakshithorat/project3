<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Load Balancer Project</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }
    .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 40px 60px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }
    .server-name {
        font-size: 42px;
        font-weight: bold;
        color: #00e676;
        margin: 20px 0;
    }
    .status {
        display: inline-block;
        background: #00e676;
        color: #1e3c72;
        padding: 6px 16px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        margin-top: 10px;
    }
    .info {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>AI-Based Load Balancer Project</h1>
        <div class="server-name">Server 1</div>
        <span class="status">● RUNNING</span>
        <div class="info">Response served by this EC2 instance</div>
    </div>
</body>
</html>
